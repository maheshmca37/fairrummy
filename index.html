<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1"
    >

    <title>Indian Rummy</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .home-box {
            width: min(92%, 500px);

            text-align: center;

            padding: 35px 25px;
        }

        .home-title {
            margin-bottom: 10px;

            font-size: 34px;
            font-weight: 900;
        }

        .home-subtitle {
            margin-bottom: 35px;

            font-size: 17px;
            color: #bbb;
        }

        .game-button {
            display: block;

            width: 100%;
            height: 68px;

            margin: 18px 0;

            border: 0;
            border-radius: 12px;

            color: #fff;

            font-size: 22px;
            font-weight: 900;

            cursor: pointer;
        }

        .solo-button {
            background: #16854b;
        }

        .friends-button {
            background: #2457d6;
        }

        .game-button:hover {
            filter: brightness(1.12);
        }

    </style>

</head>

<body>

    <main class="home-box">

        <div class="home-title">
            Indian Rummy
        </div>

        <div class="home-subtitle">
            Free game • No cash • Play for fun
        </div>


        <button
            class="game-button solo-button"
            onclick="location.href='solo.html'"
        >
            PLAY YOURSELF
        </button>


        <button
            class="game-button friends-button"
            onclick="location.href='friends.html'"
        >
            PLAY WITH FRIENDS
        </button>

    </main>

</body>

</html>
